name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1' # every Monday, for the queries added since the last push

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # to publish the findings in the Security tab

    steps:
      - uses: actions/checkout@v7

      # Build mode "none": CodeQL analyses the C# sources without building them, so the scan does not depend on
      # the .NET 11 preview SDK or on the build-time code generation.
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
