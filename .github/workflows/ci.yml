name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run still going on for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Installs the SDK pinned in global.json (a .NET 11 release candidate) and caches the NuGet packages.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Locked mode: the build fails if a package resolves to anything else than the committed lock files.
      - name: Restore
        run: dotnet restore CampusHub.slnx --locked-mode

      - name: Build
        run: dotnet build CampusHub.slnx --configuration Release --no-restore

      # The outbox tests start a MongoDB replica set with Testcontainers, on the runner's Docker.
      - name: Test
        run: dotnet test CampusHub.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
