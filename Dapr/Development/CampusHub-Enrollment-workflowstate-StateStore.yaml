apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: campushub-workflowstate-statestore
spec:
  type: state.redis
  version: v1
  metadata:
  # Local Redis started by the Aspire AppHost (fixed port); password injected by the AppHost.
  - name: redisHost
    value: localhost:6380
  - name: redisPassword
    secretKeyRef:
      name: CAMPUSHUB_REDIS_PASSWORD
      key: CAMPUSHUB_REDIS_PASSWORD
  # Since Aspire 13.x the Redis container only accepts TLS on this port (Aspire development certificate).
  - name: enableTLS
    value: "true"
  # Required by Dapr Workflow, which stores workflow state through the actor runtime.
  - name: actorStateStore
    value: "true"
scopes:
- campushub-enrollment
auth:
  secretStore: store-secrets
