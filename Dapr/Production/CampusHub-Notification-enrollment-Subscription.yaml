apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: campushub-notification-enrollment-subscription
spec:
  # One subscription per topic and app: every Enrollment event Notification handles is routed here by type.
  topic: campushub.enrollment
  pubsubname: campushub-notification-pubsub-pubsub
  routes:
    rules:
      - match: event.type == "campushub.enrollment.enrollment.confirmed"
        path: /Dapr/Enrollment/Confirmed
      - match: event.type == "campushub.enrollment.class.reminder_due"
        path: /Dapr/Enrollment/ClassReminder
  # No deadLetterTopic: a dead-letter topic nobody subscribes to silently drops the message. Once the resiliency
  # retries are exhausted, Dapr rejects the message and RabbitMQ moves it to the dlq-<consumer>-<topic> queue
  # (enableDeadLetter on the pub/sub component), where it stays until someone looks at it.
scopes:
- campushub-notification
