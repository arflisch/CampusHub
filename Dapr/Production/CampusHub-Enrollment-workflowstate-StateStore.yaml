apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: campushub-workflowstate-statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: sentinelMasterName
      value: mymaster
    - name: redisHost
      value: localhost:16379
    - name: failover
      value: "true"
    - name: sentinelPassword
      value: titi
    - name: redisPassword
      value: titi
    - name: enableTLS
      value: "false"
    # Required by Dapr Workflow, which stores workflow state through the actor runtime.
    - name: actorStateStore
      value: "true"
scopes:
- campushub-enrollment
