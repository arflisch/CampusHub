apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: campushub-notification-grading-subscription
spec:
  topic: campushub.grading
  pubsubname: campushub-notification-pubsub-pubsub
  routes:
    rules:
      - match: event.type == "campushub.grading.certificate.issued"
        path: /Dapr/Grading/CertificateIssued
  # No deadLetterTopic: a dead-letter topic nobody subscribes to silently drops the message. Once the resiliency
  # retries are exhausted, Dapr rejects the message and RabbitMQ moves it to the dlq-<consumer>-<topic> queue
  # (enableDeadLetter on the pub/sub component), where it stays until someone looks at it.
scopes:
- campushub-notification
