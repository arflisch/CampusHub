apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: campushub-enrollment-catalog-subscription
spec:
  topic: campushub.catalog
  pubsubname: campushub-enrollment-pubsub-pubsub
  routes:
    rules:
      - match: event.type == "campushub.catalog.course.cancelled"
        path: /Dapr/Catalog/CourseCancelled
  # No deadLetterTopic: once the resiliency retries are exhausted, RabbitMQ moves the message to the
  # dlq-<consumer>-<topic> queue (enableDeadLetter on the pub/sub component).
scopes:
- campushub-enrollment
